x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: dev-jwt-secret-change-me-32chars
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # Connexion MinIO (S3) pour dag_minio.py — conn_id minio_default
    AIRFLOW_CONN_MINIO_DEFAULT: aws://minio:minio123@/?endpoint_url=http%3A%2F%2Fminio%3A9000
  # Variables Airflow (surchargent les défauts du DAG)
    AIRFLOW_VAR_MINIO_SOURCE_FOLDER: /opt/data
    AIRFLOW_VAR_MINIO_BUCKET: hopital-data
    AIRFLOW_VAR_MINIO_PREFIX: raw/
    HOPITAL_DB_CONN: postgresql+psycopg2://hopital:hopital@postgres:5432/hopital
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minio
    MINIO_SECRET_KEY: minio123
    MINIO_BUCKET: hopital-data
    PYTHONPATH: /opt/scripts
  volumes: &airflow-volumes
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./scripts:/opt/scripts:ro

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./sql/01-create-hopital-db.sql:/docker-entrypoint-initdb.d/01-create-hopital-db.sql
      - ./sql/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./sql/03-seed-services.sql:/docker-entrypoint-initdb.d/03-seed-services.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@local.test || true
        airflow users reset-password --username airflow --password airflow
    depends_on:
      postgres:
        condition: service_healthy
    user: "0:0"
    restart: "no"

  airflow:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped